<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memy Cafe</title>
    <link rel="icon" type="image/x-icon" href="assets/memy_logo.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #e8dcc8;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        min-height: 100vh;
        padding: 20px;
        position: relative;
      }

      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 2px,
            rgba(139, 0, 0, 0.02) 2px,
            rgba(139, 0, 0, 0.02) 4px
          ),
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 2px,
            rgba(139, 0, 0, 0.02) 2px,
            rgba(139, 0, 0, 0.02) 4px
          );
        pointer-events: none;
      }

      body::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
          radial-gradient(
            circle at 10% 20%,
            rgba(160, 82, 45, 0.03) 0%,
            transparent 30%
          ),
          radial-gradient(
            circle at 90% 80%,
            rgba(160, 82, 45, 0.03) 0%,
            transparent 30%
          ),
          radial-gradient(
            circle at 50% 50%,
            rgba(139, 0, 0, 0.02) 0%,
            transparent 40%
          );
        pointer-events: none;
        opacity: 0.8;
      }

      .logo {
        max-width: 120px;
        margin: 0 auto 10px;
        display: block;
        text-align: center;
      }

      .logo img {
        width: 120%;
        height: auto;
        display: block;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }

      .content-wrapper {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        margin-top: 20px;
      }

      .left-section {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 8px 32px rgba(139, 0, 0, 0.1);
        border: 1px solid rgba(179, 33, 52, 0.1);
      }

      .right-section {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 8px 32px rgba(139, 0, 0, 0.1);
        border: 1px solid rgba(179, 33, 52, 0.1);
      }

      h1 {
        font-size: 48px;
        font-weight: 800;
        margin-bottom: 20px;
        color: #730000;
      }

      .subtitle {
        font-size: 20px;
        color: #730000;
        margin-bottom: 30px;
      }

      .event-details {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .detail-item {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #730000;
        font-size: 16px;
      }

      .detail-item svg {
        width: 20px;
        height: 20px;
        color: #888;
      }

      .cover-image {
        width: 100%;
        aspect-ratio: 1;
        background: #d4c4a8;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 72px;
        color: #730000;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        margin-bottom: 30px;
        position: relative;
        overflow: hidden;
        border: 3px solid #730000;
      }

      .cover-image::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 8px,
            rgba(179, 33, 52, 0.05) 8px,
            rgba(179, 33, 52, 0.05) 16px
          ),
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 8px,
            rgba(160, 82, 45, 0.03) 8px,
            rgba(160, 82, 45, 0.03) 16px
          );
        pointer-events: none;
      }

      .rsvp-section {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 12px;
        padding: 20px;
        border: 1px solid rgba(179, 33, 52, 0.2);
      }

      .rsvp-title {
        font-weight: 600;
        color: #730000;
        font-size: 18px;
      }

      .rsvp-caption {
        font-weight: 600;
        margin-bottom: 20px;
        color: #a3999a;
        font-size: 14px;
      }

      .rsvp-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .form-group label {
        font-weight: 500;
        color: #730000;
        font-size: 14px;
      }

      .form-hint {
        font-size: 12px;
        color: #a3999a;
        display: block;
      }

      .form-group input[type="text"],
      .form-group input[type="email"],
      .form-group input[type="tel"] {
        padding: 12px;
        border: 2px solid rgba(179, 33, 52, 0.2);
        border-radius: 8px;
        font-size: 15px;
        font-family: inherit;
        background: rgba(255, 255, 255, 0.8);
        transition: border-color 0.2s;
      }

      .form-group input:focus {
        outline: none;
        border-color: #b32134;
      }

      .radio-group {
        display: flex;
        gap: 12px;
      }

      .radio-option {
        flex: 1;
        cursor: pointer;
      }

      .radio-option input[type="radio"] {
        display: none;
      }

      .radio-label {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 16px;
        border: 2px solid rgba(179, 33, 52, 0.2);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.8);
        transition: all 0.2s;
      }

      .radio-option input[type="radio"]:checked + .radio-label {
        border-color: #b32134;
        background: rgba(179, 33, 52, 0.05);
      }

      .radio-label:hover {
        border-color: #730000;
      }

      .radio-label .emoji {
        font-size: 32px;
      }

      .radio-label span:last-child {
        font-size: 14px;
        color: #730000;
        font-weight: 500;
      }

      .submit-btn {
        padding: 14px 24px;
        background: #730000;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 8px;
      }

      .submit-btn:hover {
        background: #730000;
      }

      .submit-btn:active {
        transform: scale(0.98);
      }

      .submit-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .form-message {
        padding: 12px;
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
        font-weight: 500;
        display: none;
      }

      .form-message.success {
        background: rgba(34, 139, 34, 0.1);
        color: #228b22;
        display: block;
      }

      .form-message.error {
        background: rgba(220, 20, 60, 0.1);
        color: #730000;
        display: block;
      }

      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(5px);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      }

      .modal-overlay.active {
        display: flex;
      }

      .flyer img {
        width: 100%;
        border-radius: 20px;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes modalSlideIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .modal-content {
        background: #e8dcc8;
        border-radius: 20px;
        padding: 40px;
        max-width: 400px;
        width: 90%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(115, 0, 0, 0.3);
        position: relative;
        animation: modalSlideIn 0.3s ease-out;
        border: 3px solid #730000;
      }

      .spinner {
        width: 60px;
        height: 60px;
        margin: 0 auto 20px;
        border: 4px solid rgba(115, 0, 0, 0.2);
        border-top-color: #730000;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .modal-text {
        font-size: 18px;
        color: #730000;
        font-weight: 600;
        margin-bottom: 10px;
      }

      .modal-subtext {
        font-size: 14px;
        color: #a3999a;
      }

      .success-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        background: #730000;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: scaleIn 0.5s ease-out;
      }

      .close-btn {
        margin-top: 20px;
        padding: 12px 32px;
        background: #730000;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      .close-btn:hover {
        background: #5a0000;
      }

      @media (max-width: 768px) {
        .content-wrapper {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="modalOverlay" class="modal-overlay">
      <div class="modal-content" id="modalContent">
        <div id="loadingState">
          <div class="spinner"></div>
          <div class="modal-text">Submitting your RSVP...</div>
          <div class="modal-subtext">Please wait</div>
        </div>

        <!-- <div id="successState" style="display: none">
          <div class="success-icon">
            <svg
              width="40"
              height="40"
              viewBox="0 0 24 24"
              fill="none"
              stroke="white"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div class="modal-text">RSVP Confirmed!</div>
          <div class="modal-subtext">Thank you for registering</div>
          <button class="close-btn" onclick="closeModal()">Close</button>
        </div> -->

        <div id="successState" style="display: none">
          <div class="success-icon">
            <svg
              width="40"
              height="40"
              viewBox="0 0 24 24"
              fill="none"
              stroke="white"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div class="modal-text">RSVP Confirmed!</div>
          <!-- <div class="modal-subtext">Thank you for registering</div> -->

          <div>
            <div
              style="
                font-size: 14px;
                color: #730000;
                margin-bottom: 12px;
                font-weight: 600;
              "
            >
              Share with friends
            </div>

            <div
              style="
                display: flex;
                gap: 10px;
                justify-content: center;
                margin-bottom: 20px;
                padding-bottom: 20px;
                border-bottom: 2px solid rgba(115, 0, 0, 0.1);
              "
            >
              <button
                onclick="copyLink()"
                style="
                  padding: 10px 16px;
                  background: #730000;
                  color: white;
                  border: none;
                  border-radius: 6px;
                  cursor: pointer;
                  font-size: 14px;
                  font-weight: 600;
                "
              >
                Copy Link
              </button>
            </div>
          </div>

          <button class="close-btn" onclick="closeModal()">Close</button>
        </div>

        <div id="errorState" style="display: none">
          <div style="font-size: 48px; margin-bottom: 20px">✗</div>
          <div class="modal-text">Submission Failed</div>
          <div class="modal-subtext">Please try again</div>
          <button class="close-btn" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>

    <script>
      async function updateHeadcount() {
        const SCRIPT_URL =
          "https://script.google.com/macros/s/AKfycbyhuPDhyIT2RJGdzR_R-zKzSiCBhQFv-c-3QhRSJSYSJOnVa050tcERfvo5N4Y4aYQeVQ/exec";

        try {
          const response = await fetch(SCRIPT_URL);
          const data = await response.json();

          if (data.success) {
            const headcountElement = document.getElementById("headcount");
            const count = data.total;

            if (count >= 20) {
              const roundedCount = Math.floor(count / 10) * 10;
              headcountElement.textContent = roundedCount + "+ people going";
            } else {
              headcountElement.textContent = count + " people going";
            }
          }
        } catch (error) {
          console.error("Error fetching headcount:", error);
        }
      }

      function closeModal() {
        const modal = document.getElementById("modalOverlay");
        modal.classList.remove("active");

        document.getElementById("loadingState").style.display = "block";
        document.getElementById("successState").style.display = "none";
        document.getElementById("errorState").style.display = "none";
      }

      document.addEventListener("DOMContentLoaded", function () {
        updateHeadcount();

        const form = document.getElementById("rsvpForm");
        const submitBtn = document.getElementById("submitBtn");
        const modal = document.getElementById("modalOverlay");

        const SCRIPT_URL =
          "https://script.google.com/macros/s/AKfycbyhuPDhyIT2RJGdzR_R-zKzSiCBhQFv-c-3QhRSJSYSJOnVa050tcERfvo5N4Y4aYQeVQ/exec";
        form.addEventListener("submit", async function (e) {
          e.preventDefault();

          modal.classList.add("active");
          submitBtn.disabled = true;

          const contactValue = document.getElementById("email").value;
          const phoneValue = document.getElementById("phone").value;

          const formData = {
            name: document.getElementById("name").value,
            email: contactValue,
            phone: phoneValue,
            attendance: document.querySelector(
              'input[name="attendance"]:checked',
            ).value,
            timestamp: new Date().toISOString(),
          };

          try {
            await fetch(SCRIPT_URL, {
              method: "POST",
              mode: "no-cors",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(formData),
            });

            await new Promise((resolve) => setTimeout(resolve, 1000));

            document.getElementById("loadingState").style.display = "none";
            document.getElementById("successState").style.display = "block";

            form.reset();

            setTimeout(() => {
              updateHeadcount();
            }, 1000);

            // setTimeout(() => {
            //   closeModal();
            //   submitBtn.disabled = false;
            // }, 10000);
          } catch (error) {
            console.error("Error submitting RSVP:", error);

            document.getElementById("loadingState").style.display = "none";
            document.getElementById("errorState").style.display = "block";

            submitBtn.disabled = false;
          }
        });
      });

      function copyLink() {
        navigator.clipboard.writeText(window.location.href).then(() => {
          alert("Link copied to clipboard!");
        });
      }
    </script>

    <div class="container">
      <div class="logo">
        <img src="memy-logo.png" alt="Memy Cafe Logo" />
      </div>

      <div class="content-wrapper">
        <div class="left-section">
          <div
            style="margin-top: 0px; color: #888; font-size: 30px"
            class="flyer"
          >
            <img src="flyer.png" alt="" />
          </div>
        </div>

        <div class="right-section">
          <div
            style="
              background: rgba(179, 33, 52, 0.1);
              border-radius: 12px;
              padding: 8px;
              text-align: center;
              margin-bottom: 10px;
              border: 2px solid rgba(179, 33, 52, 0.2);
            "
          >
            <div
              style="
                font-size: 12px;
                color: #c94a4a;
                margin-top: 4px;
                font-weight: 400;
              "
            >
              <span id="headcount">- people are going</span>
            </div>
          </div>

          <div class="rsvp-section">
            <div class="rsvp-title">📝 RSVP</div>
            <div class="rsvp-caption">
              rsvp not required but helpful for headcount!
            </div>
            <form id="rsvpForm" class="rsvp-form">
              <div class="form-group">
                <label for="name">Name *</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  required
                  placeholder="your name"
                />
              </div>

              <div class="form-group">
                <label for="email">Email * </label>
                <span class="form-hint"></span>
                <input
                  type="email"
                  id="email"
                  name="email"
                  required
                  placeholder="your@email.com"
                />
              </div>

              <div class="form-group">
                <label for="phone">Phone Number (optional)</label>
                <span class="form-hint"></span>
                <input
                  type="text"
                  id="phone"
                  name="phone"
                  placeholder="+15551234567"
                />
              </div>

              <div class="form-group">
                <label>Attendance *</label>
                <div class="radio-group">
                  <label class="radio-option">
                    <input
                      type="radio"
                      name="attendance"
                      value="going"
                      required
                    />
                    <span class="radio-label">
                      <span class="emoji">👍</span>
                      <span>I'm Going</span>
                    </span>
                  </label>
                  <label class="radio-option">
                    <input
                      type="radio"
                      name="attendance"
                      value="maybe"
                      required
                    />
                    <span class="radio-label">
                      <span class="emoji">🤔</span>
                      <span>Maybe</span>
                    </span>
                  </label>
                </div>
              </div>

              <button type="submit" id="submitBtn" class="submit-btn">
                Submit RSVP
              </button>
              <div id="formMessage" class="form-message"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memy Cafe</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #e8dcc8;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        min-height: 100vh;
        padding: 20px;
        position: relative;
      }

      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 2px,
            rgba(139, 0, 0, 0.02) 2px,
            rgba(139, 0, 0, 0.02) 4px
          ),
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 2px,
            rgba(139, 0, 0, 0.02) 2px,
            rgba(139, 0, 0, 0.02) 4px
          );
        pointer-events: none;
      }

      body::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
          radial-gradient(
            circle at 10% 20%,
            rgba(160, 82, 45, 0.03) 0%,
            transparent 30%
          ),
          radial-gradient(
            circle at 90% 80%,
            rgba(160, 82, 45, 0.03) 0%,
            transparent 30%
          ),
          radial-gradient(
            circle at 50% 50%,
            rgba(139, 0, 0, 0.02) 0%,
            transparent 40%
          );
        pointer-events: none;
        opacity: 0.8;
      }

      .logo {
        max-width: 120px;
        margin: 0 auto 40px;
        display: block;
        text-align: center;
      }

      .logo img {
        width: 100%;
        height: auto;
        display: block;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }

      .content-wrapper {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        margin-top: 20px;
      }

      .left-section {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 8px 32px rgba(139, 0, 0, 0.1);
        border: 1px solid rgba(179, 33, 52, 0.1);
      }

      .right-section {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 8px 32px rgba(139, 0, 0, 0.1);
        border: 1px solid rgba(179, 33, 52, 0.1);
      }

      h1 {
        font-size: 48px;
        font-weight: 800;
        margin-bottom: 20px;
        color: #b32134;
      }

      .subtitle {
        font-size: 20px;
        color: #c94a4a;
        margin-bottom: 30px;
      }

      .event-details {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .detail-item {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #b32134;
        font-size: 16px;
      }

      .detail-item svg {
        width: 20px;
        height: 20px;
        color: #888;
      }

      .cover-image {
        width: 100%;
        aspect-ratio: 1;
        background: #d4c4a8;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 72px;
        color: #b32134;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        margin-bottom: 30px;
        position: relative;
        overflow: hidden;
        border: 3px solid #b32134;
      }

      .cover-image::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 8px,
            rgba(179, 33, 52, 0.05) 8px,
            rgba(179, 33, 52, 0.05) 16px
          ),
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 8px,
            rgba(160, 82, 45, 0.03) 8px,
            rgba(160, 82, 45, 0.03) 16px
          );
        pointer-events: none;
      }
      /* 
      .cover-image::after {
        content: "happy hours";
        font-weight: 800;
        letter-spacing: -2px;
        text-align: center;
        line-height: 1.2;
        position: relative;
        z-index: 1;
      } */

      .rsvp-section {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 12px;
        padding: 20px;
        border: 1px solid rgba(179, 33, 52, 0.2);
      }

      .rsvp-title {
        font-weight: 600;
        /* margin-bottom: 20px; */
        color: #b32134;
        font-size: 18px;
      }

      .rsvp-caption {
        font-weight: 600;
        margin-bottom: 20px;
        color: #a3999a;
        font-size: 14px;
      }

      .rsvp-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .form-group label {
        font-weight: 500;
        color: #b32134;
        font-size: 14px;
      }

      .form-hint {
        font-size: 12px;
        color: #a3999a;
        display: block;
      }

      .form-group input[type="text"],
      .form-group input[type="email"],
      .form-group input[type="tel"] {
        padding: 12px;
        border: 2px solid rgba(179, 33, 52, 0.2);
        border-radius: 8px;
        font-size: 15px;
        font-family: inherit;
        background: rgba(255, 255, 255, 0.8);
        transition: border-color 0.2s;
      }

      .form-group input:focus {
        outline: none;
        border-color: #b32134;
      }

      .radio-group {
        display: flex;
        gap: 12px;
      }

      .radio-option {
        flex: 1;
        cursor: pointer;
      }

      .radio-option input[type="radio"] {
        display: none;
      }

      .radio-label {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 16px;
        border: 2px solid rgba(179, 33, 52, 0.2);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.8);
        transition: all 0.2s;
      }

      .radio-option input[type="radio"]:checked + .radio-label {
        border-color: #b32134;
        background: rgba(179, 33, 52, 0.05);
      }

      .radio-label:hover {
        border-color: #b32134;
      }

      .radio-label .emoji {
        font-size: 32px;
      }

      .radio-label span:last-child {
        font-size: 14px;
        color: #b32134;
        font-weight: 500;
      }

      .submit-btn {
        padding: 14px 24px;
        background: #b32134;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 8px;
      }

      .submit-btn:hover {
        background: #8b1928;
      }

      .submit-btn:active {
        transform: scale(0.98);
      }

      .form-message {
        padding: 12px;
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
        font-weight: 500;
        display: none;
      }

      .form-message.success {
        background: rgba(34, 139, 34, 0.1);
        color: #228b22;
        display: block;
      }

      .form-message.error {
        background: rgba(220, 20, 60, 0.1);
        color: #dc143c;
        display: block;
      }

      @media (max-width: 768px) {
        .content-wrapper {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("rsvpForm");
        const message = document.getElementById("formMessage");

        const SCRIPT_URL =
          "https://script.google.com/macros/s/AKfycbx5dFriBZcg2bJD3HxNQvfsd_yNOaloGnlffrLFc-6kAS-VG6RDpR_hTn6EAMHxzmLtzA/exec";

        form.addEventListener("submit", async function (e) {
          e.preventDefault();

          const contactValue = document.getElementById("contact").value;
          const formData = {
            name: document.getElementById("name").value,
            contact: contactValue,
            contactType: contactValue.includes("@") ? "email" : "phone",
            attendance: document.querySelector(
              'input[name="attendance"]:checked',
            ).value,
            timestamp: new Date().toISOString(),
          };

          try {
            await fetch(SCRIPT_URL, {
              method: "POST",
              mode: "no-cors",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(formData),
            });

            message.className = "form-message success";
            message.textContent = "✓ RSVP submitted successfully!";
            form.reset();
          } catch (error) {
            console.error("Error submitting RSVP:", error);
            message.className = "form-message error";
            message.textContent = "✗ Failed to submit. Please try again.";
          }

          // Hide message after 5 seconds
          setTimeout(() => {
            message.style.display = "none";
          }, 5000);
        });
      });
    </script>
    <div class="container">
      <div class="logo">
        <img src="assets/memy_logo.png" alt="Memy Cafe Logo" />
      </div>

      <div class="content-wrapper">
        <div class="left-section">
          <div style="margin-top: 30px; color: #888; font-size: 30px">
            POSTER COMING SOON
          </div>
        </div>

        <div class="right-section">
          <!-- <div class="cover-image"></div> -->

          <div class="rsvp-section">
            <div class="rsvp-title">📝 RSVP</div>
            <div class="rsvp-caption">
              rsvp not required but helpful for a rough headcount
            </div>
            <form id="rsvpForm" class="rsvp-form">
              <div class="form-group">
                <label for="name">Name</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  required
                  placeholder="Your name"
                />
              </div>

              <div class="form-group">
                <label for="email">Email or Phone Number </label>
                <span class="form-hint">(for reminders)</span>
                <input
                  type="text"
                  id="contact"
                  name="contact"
                  required
                  placeholder="your@email.com or +1 (555) 123-4567"
                />
              </div>

              <div class="form-group">
                <label>Attendance</label>
                <div class="radio-group">
                  <label class="radio-option">
                    <input
                      type="radio"
                      name="attendance"
                      value="going"
                      required
                    />
                    <span class="radio-label">
                      <span class="emoji">👍</span>
                      <span>I'm Going</span>
                    </span>
                  </label>
                  <label class="radio-option">
                    <input
                      type="radio"
                      name="attendance"
                      value="maybe"
                      required
                    />
                    <span class="radio-label">
                      <span class="emoji">🤔</span>
                      <span>Maybe</span>
                    </span>
                  </label>
                </div>
              </div>

              <button type="submit" class="submit-btn">Submit RSVP</button>
              <div id="formMessage" class="form-message"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
